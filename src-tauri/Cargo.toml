[package]
name = "sports-scoreboard-native"
version = "0.1.0"
description = "Windows desktop wrapper for Sports Scoreboard"
authors = ["Ryan Morrisroe"]
license = "MIT"
repository = "https://github.com/RyanMorrisroe/SportsScoreboard-Native"
homepage = "https://github.com/RyanMorrisroe/SportsScoreboard-Native"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
